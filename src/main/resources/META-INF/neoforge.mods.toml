modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/EVGA2048/Create-Distant-Stock/issues"

[[mixins]]
config="distantstock.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="https://github.com/EVGA2048/Create-Distant-Stock"
logoFile="distantstock-icon.png"
credits="Thanks to MUL, KNaMg_Rana, w4yw and BSGM for early development feedback and suggestions."
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[21.1,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="create"
type="required"
versionRange="[6.0.0,6.1.0)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="transerver"
type="required"
versionRange="[0.1.0-SNAPSHOT,0.2.0)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="curios"
type="optional"
versionRange="[9.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="fluidlogistics"
type="optional"
versionRange="[1.3.1,1.4.0)"
ordering="AFTER"
side="BOTH"
